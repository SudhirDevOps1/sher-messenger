name: CI

on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  schedule:
    - cron: "0 4 * * 1"   # weekly dependency audit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Install
        run: npm ci

      - name: Typegen + typecheck
        run: |
          npx next typegen
          npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: OSV vulnerability scan (advisory, non-blocking for dev deps)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json

      - name: License policy
        run: |
          npx --yes license-checker-rseidelsohn@4 --production \
            --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;BlueOak-1.0.0;MPL-2.0;CC-BY-4.0;Unlicense;CC0-1.0;UNLICENSED;LGPL-3.0-or-later;LGPL-3.0;LGPL-2.1-or-later"

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start relay and run conformance suite
        env:
          SHER_RATE_LIMIT: off   # CI shares one IP; production keeps buckets on
          SHER_INVITE_ONLY: "1"  # keep invite gate on — bootstrap provisions the invite on a clean DB
        run: |
          npm start & 
          for i in $(seq 1 30); do curl -sf localhost:3000/api/ked/healthz >/dev/null && break; sleep 2; done
          curl -sf "localhost:3000/api/dev-selftest?relay=1" | tee selftest.json
          node -e "const j=require('./selftest.json');if(!j.allOk){console.error(j.checks.filter(c=>!c.ok));process.exit(1)};console.log('conformance:',j.passed+'/'+j.total)"

      - name: Verify never-HTML contract
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/ked/__crash-test)
          ct=$(curl -s -o /dev/null -w '%{content_type}' localhost:3000/api/ked/__crash-test)
          [ "$code" = "500" ] && [ "${ct#application/json}" != "$ct" ] || { echo "relay returned $code $ct"; exit 1; }
          echo "crash guard OK: $code $ct"

      - name: SBOM (CycloneDX)
        run: |
          npm i -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file sbom.json --output-format json --ignore-npm-errors --package-lock-only
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
      - uses: actions/upload-artifact@v4
        with: { name: selftest, path: selftest.json }
