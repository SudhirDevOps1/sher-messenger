title = "sher-messenger gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "false positives - env var names and crypto comments (not real secrets)"
paths = [
  '''src/app/deploy/page\.tsx''',
  '''src/lib/primitives\.ts''',
  '''src/lib/protocol\.ts''',
]
stopWords = [
  "TURSO_TOKEN",
  "TURSO_URL",
  "vault: 750k",
  "hkdf2",
]
