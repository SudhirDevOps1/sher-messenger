# SHER Messenger — Cloudflare Workers / OpenNext
# Official shape: https://developers.cloudflare.com/workers/frameworks/framework-guides/nextjs/
# Build: npx opennextjs-cloudflare build
# Deploy: npx wrangler deploy
# Secrets: npx wrangler secret put TURSO_TOKEN

name = "sher-messenger"
main = ".open-next/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BACKEND_TARGET = "workers"
# DB layer is now dashboard-driven — do NOT hardcode DB_TARGET / SHER_DB here
# or every deploy will reset your Runtime variables (Neon/Turso) back to memory.
# Set DB_TARGET and SHER_DB as Text variables in Cloudflare Dashboard > Settings > Variables.
# Zero-config fallback (no dashboard vars) is still memory via src/server/store.ts selection order.
SHER_INVITE_ONLY = "1"
SHER_RATE_LIMIT = "on"

[observability]
enabled = false

[env.staging]
name = "sher-messenger-staging"
workers_dev = true

[env.staging.vars]
BACKEND_TARGET = "workers"
# staging also dashboard-driven — keep DB vars out of file
SHER_INVITE_ONLY = "1"
SHER_RATE_LIMIT = "on"
