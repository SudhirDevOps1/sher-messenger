# SHER Messenger — Cloudflare Workers / OpenNext
# Official shape: https://developers.cloudflare.com/workers/frameworks/framework-guides/nextjs/
# Build: npx opennextjs-cloudflare build
# Deploy: npx wrangler deploy

name = "sher-messenger"
main = ".open-next/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ── KEEP DASHBOARD VARIABLES: Dashboard me jo bhi env/secrets save karoge wo deploy ke bad delete nahi honge ──
keep_vars = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BACKEND_TARGET = "workers"
SHER_RATE_LIMIT = "on"
SHER_BUILD_HASH = "prod"

[observability]
enabled = false

[env.staging]
name = "sher-messenger-staging"
workers_dev = true
keep_vars = true

[env.staging.vars]
BACKEND_TARGET = "workers"
SHER_RATE_LIMIT = "on"

