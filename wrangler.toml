# SHER Messenger — Cloudflare Workers / OpenNext
# Official shape: https://developers.cloudflare.com/workers/frameworks/framework-guides/nextjs/
# Build: npx opennextjs-cloudflare build
# Deploy: npx wrangler deploy
# Secrets: npx wrangler secret put TURSO_TOKEN

name = "sher-messenger"
main = ".open-next/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
BACKEND_TARGET = "workers"
# ── Auto-visible Text variables (dashboard me Add ki zarurat nahi — bas Value bharo) ──
DB_TARGET = "postgres"
SHER_DB = "postgres"
STORE_TARGET = "b2"
SHER_INVITE_ONLY = "1"
SHER_RATE_LIMIT = "on"
OPERATOR_EMAIL = "SudhirK926@gmail.com"
ADMIN_EMAIL = ""
ADMIN_PASSWORD = ""
VAPID_SUBJECT = "mailto:SudhirK926@gmail.com"
# ── Secrets (Encrypted) ko Dashboard > Add variable > Type Secret se bharo, yahan plain nahi ──
# DATABASE_URL, B2_KEY_ID, B2_APPLICATION_KEY, B2_BUCKET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY
# Inko `npx wrangler secret put <NAME>` se bhi dal sakte ho — toml me value nahi likhni

[observability]
enabled = false

[env.staging]
name = "sher-messenger-staging"
workers_dev = true

[env.staging.vars]
BACKEND_TARGET = "workers"
# staging also dashboard-driven — keep DB vars out of file
SHER_INVITE_ONLY = "1"
SHER_RATE_LIMIT = "on"
